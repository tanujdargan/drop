[package]
name = "drop-receiver-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Drop file receiver"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# BLE
btleplug = "0.11"

# HTTP server (lightweight)
tiny_http = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
sha2 = "0.10"

# Utilities
uuid = { version = "1.4", features = ["v4", "serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
dirs = "5"
chrono = "0.4"

# Form parsing for file uploads
multer = "3"
bytes = "1"
mime = "0.3"

[dev-dependencies]
tempfile = "3"
